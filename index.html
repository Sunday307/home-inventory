<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭庫存">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>家庭庫存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜實用的居家工具，像貼在櫥櫃門內側的那張清單
   IDEA: 木作收納櫃＋補貨單
   PICTURE: 可自行佈置的櫃子格線本身，物品就放在格子裡
   COLOUR and TYPE: 白底、原木櫃框、炭黑字、警示紅；Noto Sans TC
   LAYOUT: 頂部搜尋與提醒、內容、底部分頁列 */
:root{color-scheme:light;--bg:#faf8f4;--card:#fff;--ink:#23201c;--mute:#7a7066;--line:#e8e1d6;--wood:#c4935f;--woodd:#a87745;--cell:#fbf5ec;--red:#d4342a;--redbg:#fdecea;--ok:#2d6a4f;--hit:#ffe27a;--shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#171513;--card:#221f1c;--ink:#efe9e1;--mute:#a59a8e;--line:#3a342e;--wood:#9a7046;--woodd:#7d5a37;--cell:#2a2520;--red:#ff6b5e;--redbg:#3a1f1c;--ok:#7cc8a0;--hit:#6b5a12;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#171513;--card:#221f1c;--ink:#efe9e1;--mute:#a59a8e;--line:#3a342e;--wood:#9a7046;--woodd:#7d5a37;--cell:#2a2520;--red:#ff6b5e;--redbg:#3a1f1c;--ok:#7cc8a0;--hit:#6b5a12;--shadow:none}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:880px;margin:0 auto 10px}
h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.02em}
.mode{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.mode.on{color:var(--ok);border-color:var(--ok)}
.search{max-width:880px;margin:0 auto;position:relative;display:flex;gap:8px}.search .qw{position:relative;flex:1}
.scanbtn{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);display:grid;place-items:center}.search .scanbtn svg{position:static;width:24px;height:24px;stroke:currentColor}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px 0 40px;font-size:16px}
.search svg{position:absolute;left:13px;top:14px;width:18px;height:18px;stroke:var(--mute)}
main,#alerts{max-width:880px;margin:0 auto;padding:0 max(4vw,14px)}
#alerts{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
#alerts:empty{display:none}
.alert{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;background:var(--redbg);color:var(--red);min-height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip-f{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;min-height:40px;font-size:15px}
.chip-f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-f b{font-weight:700;margin-left:4px}
.chips.cats{margin-top:4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips.cats .chip-f{flex:none;min-height:36px;font-size:14px;padding:4px 12px}
h2{font-size:15px;color:var(--mute);font-weight:700;margin:20px 0 8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.card.low{border-color:var(--red);background:linear-gradient(90deg,var(--redbg),var(--card) 60%)}
.card .main{flex:1;cursor:pointer;padding:2px 0}
.name{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.low .name,.low .qty b{color:var(--red)}
.tag-red{font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 7px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.loc{border:0;background:none;padding:0;color:var(--mute);font-size:14px;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.badge{font-size:13px;color:var(--mute);background:var(--cell);border-radius:6px;padding:1px 8px;white-space:nowrap}
.badge.red{color:var(--red);background:var(--redbg);font-weight:700}
.qtybox{display:flex;align-items:center;gap:4px}
.qty{text-align:center;min-width:54px;line-height:1.15}
.qty b{font-size:22px;display:block}
.qty small{font-size:13px;color:var(--mute)}
.qty em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--cell);font-size:22px;line-height:1}
.step.plus{background:var(--ink);color:var(--bg);border-color:var(--ink)}
mark{background:var(--hit);color:inherit;border-radius:3px}
.fab{position:fixed;right:max(4vw,16px);bottom:92px;z-index:6;border:0;border-radius:16px;height:54px;padding:0 20px;background:var(--wood);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(120,80,40,.35)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
/* cabinets */
.cab{margin:16px 0 22px}
.cabhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.cabhead small{color:var(--mute);font-size:13px}
.cabhead h3{margin:0;font-size:19px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px;min-height:44px;font-size:15px;font-weight:500}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.wide{width:100%}
.frame{border:8px solid var(--wood);border-radius:10px;background:var(--woodd);padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),var(--shadow)}
.grid{display:grid;gap:6px;padding:6px;background:var(--woodd)}
.cell{background:var(--cell);border-radius:5px;min-height:78px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:flex-start;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);transition:background .2s,opacity .2s}
.clabel{font-size:12px;color:var(--mute);font-weight:500}
.chip{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.red{color:var(--red);border-color:var(--red);font-weight:700}
.cell.hit{background:var(--hit);box-shadow:0 0 0 3px var(--hit)}
.cell.dim{opacity:.35}
.cell.flash{animation:flash 1.6s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 var(--hit)}50%{box-shadow:0 0 0 6px var(--hit);background:var(--hit)}}
@media(prefers-reduced-motion:reduce){.cell.flash{animation:none;background:var(--hit)}}
/* shopping */
.buy{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.buy input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.buy .t{flex:1}
.buy .n{font-weight:700;color:var(--red);font-size:17px}
.buy .s{font-size:13px;color:var(--mute)}
.buy .q{font-weight:900;font-size:20px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>*{flex:1 1 160px}
.note{font-size:14px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.note ol{margin:6px 0 0;padding-left:20px}
/* forms / modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,14,8,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(4vw,16px) 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:20px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.in{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px}
textarea.in{height:140px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.batch{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:8px;align-items:center;margin-bottom:8px}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--red);font-size:18px}
.cellgrid{display:grid;gap:6px;background:var(--woodd);padding:6px;border-radius:8px}
.cellgrid input{height:40px;border:0;border-radius:5px;background:var(--cell);padding:0 6px;font-size:14px;width:100%}
.swatches{display:flex;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.list-in-cell .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:220px;border:0;background:none;padding:8px 0 10px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-height:60px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);font-weight:700}
nav .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.sample{font-size:13px;color:var(--mute);margin:14px 0 0}
#scanner{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#scanner.hidden{display:none}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanbox{position:absolute;left:10%;right:10%;top:32%;height:22%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.scanbar{background:#111;color:#fff;padding:14px max(4vw,16px) calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.scanbar .row{margin:0}.scanbar .in{background:#222;color:#fff;border-color:#444}
.scanbar p{margin:0;font-size:14px;color:#ccc;text-align:center}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.code{display:inline-flex;align-items:center;gap:4px;background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px;font-family:ui-monospace,monospace;font-size:14px}
.code button{border:0;background:none;color:var(--red);width:32px;height:32px}
.quick{text-align:center}.quick .big-q{font-size:44px;font-weight:900;line-height:1.1}.quick .big-q small{font-size:16px;color:var(--mute);margin-left:4px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto;margin:8px 0}
.pick button{flex:none;text-align:left;line-height:1.4;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:44px}
.pick small{color:var(--mute)}
.estimate{margin:10px 0 0;font-size:16px}.estimate b{font-size:22px}.estimate small{color:var(--mute);font-size:13px;margin-left:6px}
.spend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.big{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.big small{color:var(--mute);font-size:13px}.big b{font-size:clamp(24px,7vw,32px);font-weight:900;line-height:1.2;white-space:nowrap}
.plist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 12px;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}
.prow .pn{flex:1}.prow small{color:var(--mute);font-size:13px}.prow b{white-space:nowrap}
.prow .icon{width:40px;height:40px;font-size:14px}
.pday{margin-bottom:6px}.pday summary{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px;align-items:center}
.pday summary b{white-space:nowrap}
.area{margin:18px 0 6px}
.area h3{font-size:19px;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--wood);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.area h3 .btn{min-height:36px;font-size:14px;padding:0 10px;font-weight:500}
.addcab{width:100%;border:1px dashed var(--line);background:none;border-radius:12px;min-height:44px;color:var(--mute);font-size:15px}
.area h3 small{font-size:13px;color:var(--mute);font-weight:500;margin-left:6px}
.acab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.acabh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.acabh b{font-size:16px}.acabh small{color:var(--mute);flex:1}
.acabh .btn{min-height:36px;font-size:14px;padding:0 10px}
.arow{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.acell{border:0;background:none;padding:4px 0;text-align:left;color:var(--mute);font-size:14px;text-decoration:underline dotted;text-underline-offset:3px}
.aitems{display:flex;flex-wrap:wrap;gap:6px}
.aitem{border:1px solid var(--line);background:var(--cell);border-radius:8px;padding:4px 10px;min-height:36px;font-size:15px;text-align:left}
.aitem small{color:var(--mute);font-size:13px}
.aitem.red{color:var(--red);border-color:var(--red);background:var(--redbg);font-weight:700}
.aitem.red small{color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>家庭庫存</h1><span id="mode" class="mode">載入中</span></div>
  <div class="search">
    <div class="qw"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋用品或位置，例如：電池" autocomplete="off"></div>
    <button class="scanbtn" data-act="scanFind" aria-label="掃條碼" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
  </div>
</header>
<div id="alerts"></div>
<main id="view"><p class="empty">載入中…</p></main>
<nav id="nav">
  <button data-tab="inv"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>庫存</button>
  <button data-tab="area"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>區域</button>
  <button data-tab="cab"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 9h16M4 15h16M12 3v18"/></svg>收納櫃</button>
  <button data-tab="buy"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>採購清單<span class="dot" id="buydot" hidden></span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="scanner" class="hidden"><video id="scanvideo" playsinline muted autoplay></video><div class="scanbox"></div>
  <div class="scanbar"><p id="scanmsg">把條碼放進框框裡</p>
  <div class="row"><input class="in" id="scanmanual" inputmode="numeric" placeholder="或手動輸入條碼數字" style="flex:2 1 160px"><button class="btn dark" data-act="scanManual" style="flex:1 1 80px">確定</button></div>
  <button class="btn wide" data-act="scanCancel" style="background:#333;color:#fff;border-color:#444">取消</button></div></div>
<script>
window.__step = function (t) { var m = document.getElementById('mode'); if (m) m.textContent = t; };
window.onerror = function (msg, src, line, col) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div class="note" style="border-color:#d4342a"><b style="color:#d4342a">App 啟動失敗</b><p>請把這個畫面截圖給我：</p><p style="word-break:break-all">' + String(msg).replace(/</g, '&lt;') + '（第 ' + line + ' 行，第 ' + col + ' 字）</p><p>' + navigator.userAgent.replace(/</g, '&lt;') + '</p></div>';
};
window.__step('啟動中 1/3');
</script>
<script>
{
window.__step('啟動中 2/3');
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const DEFAULT_AREAS = ['客廳','遊戲區','餐廳區','內玄關','外玄關','外陽台','廚房陽台','浚碩房間','儲藏室（小房間）','主臥','主臥廁所','客廳廁所','廚房'];
const DEFAULT_CATS = ['食品','清潔','紙類','盥洗','個人用品','藥品','嬰兒用品','寢具','五金雜物'];
const WD = ['日','一','二','三','四','五','六'];
const COLORS = ['#c4935f','#8a6a4f','#e4d3b8','#6f8f8a','#a5a5a0','#d9a5a0','#e8ebee'];
let catF = '', S = null, tab = 'inv', filter = 'all', query = '', hlCell = null, settings = null, draft = null, delArm = false;

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
function daysLeft(exp) {
  if (!exp) return null;
  const a = exp.split('-').map(Number), t = todayStr().split('-').map(Number);

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);
const Store = {
  kind: 'mem', ref: null, busy: false, again: false,
  async load() {
    if (IS_GAS) { this.kind = 'gas'; const txt = await gas('getState'); return txt ? JSON.parse(txt) : null; }
    if (window.claude && claude.use) {
      try {
        const [db, user] = await withTimeout(Promise.all([claude.use('db'), claude.use('user')]), 8000);
        const id = user && await withTimeout(user.id(), 5000);
        if (db && id) {
          this.ref = db.doc('data/users/' + id + '/inventory');
          const snap = await withTimeout(this.ref.get(), 8000);
          this.kind = 'db';
          return snap.exists ? JSON.parse(JSON.stringify(snap.data().state || null)) : null;
        }
      } catch (e) { this.ref = null; }
      return null;
    }
    this.kind = 'local';
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    try { const txt = localStorage.getItem('home-inventory'); return txt ? JSON.parse(txt) : null; } catch (e) { return null; }
  },
  async write() {
    if (this.kind === 'readonly') return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      const json = JSON.stringify(S);
      if (this.kind === 'gas') await gas('saveState', json);
      else if (this.kind === 'local') localStorage.setItem('home-inventory', json);
      else if (this.kind === 'db') await this.ref.set({ state: JSON.parse(json), savedAt: new Date().toISOString() });
    } catch (e) { toast('儲存失敗：' + (e && e.message || e)); }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  }
};
let saveT;

function viewBuy() {

/* ---------- 條碼掃描 ---------- */
const hasCam = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let scanReader = null, scanCb = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  const add = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  return add('zxing.min.js').catch(() => add('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'));
}
async function startScan(cb, msg) {
  scanCb = cb;
  $('#scanmsg').textContent = msg || '把條碼放進框框裡';
  $('#scanmanual').value = '';
  $('#scanner').classList.remove('hidden');
  try {
    await loadZXing();
    const Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX]);
    scanReader = new Z.BrowserMultiFormatReader(hints, 250);
    await scanReader.decodeFromConstraints({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } }, $('#scanvideo'), (res) => {
      if (res && scanCb) { const code = res.getText(); if (navigator.vibrate) navigator.vibrate(60); finishScan(code); }
    });
  } catch (e) {
    const n = e && e.name;
    $('#scanmsg').textContent = n === 'NotAllowedError' ? '沒有相機權限。請到 iPhone「設定 › Safari › 相機」允許，或直接手動輸入條碼。' : '相機無法啟動，可以手動輸入條碼。';
  }
}
function stopScan() {
  try { if (scanReader) scanReader.reset(); } catch (e) {}
  scanReader = null;
  const v = $('#scanvideo'); if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  $('#scanner').classList.add('hidden');
}
function finishScan(code) {
  code = String(code || '').trim(); if (!code) return;
  const cb = scanCb; scanCb = null; stopScan(); if (cb) cb(code);
}
const itemByCode = code => S.items.find(i => (i.barcodes || []).includes(code));
function onFound(code) {
  const it = itemByCode(code);
  if (it) return quickItem(it.id);
  draft = { mode: 'bindpick', code, q: '' };
  bindPick();
}
function bindPick() {
  const d = draft, q = (d.q || '').toLowerCase();

    '<button class="btn dark wide" data-act="newFromCode">＋ 新增成新的用品</button>' +
    '<label class="f"><span>或綁到現有用品</span><input class="in" id="bindq" value="' + esc(d.q) + '" placeholder="輸入名稱篩選"></label>' +
    '<div class="pick">' + list.map((i, n) => (n === 0 && isLow(i) ? '<p class="sample" style="margin:2px 0 0">需補貨（剛買回來的多半在這裡）</p>' : '') +
      (n > 0 && isLow(list[n - 1]) && !isLow(i) ? '<p class="sample" style="margin:8px 0 0">其他用品</p>' : '') +
      '<button data-bindto="' + i.id + '"' + (isLow(i) ? ' style="border-color:var(--red)"' : '') + '>' + (isLow(i) ? '<b style="color:var(--red)">' + esc(i.name) + '</b>' : esc(i.name)) + ' <small>' + esc(i.category || '') + '・' + esc(locText(i)) + '</small></button>').join('') + '</div>' +

/* ---------- 行事曆（.ics） ---------- */
function icsEsc(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsTime(dateStr, h) { return dateStr.replace(/-/g, '') + 'T' + pad(h) + '0000'; }
function buildIcs(events) {
  const now = new Date(), st = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//home-inventory//zh-TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  events.forEach(e => {
    L.push('BEGIN:VEVENT', 'UID:' + e.uid + '@home-inventory', 'DTSTAMP:' + st, 'DTSTART:' + e.start, 'DTEND:' + e.end);
    if (e.rrule) L.push('RRULE:' + e.rrule);
    L.push('SUMMARY:' + icsEsc(e.title), 'DESCRIPTION:' + icsEsc(e.desc));
    if (/^https:/.test(location.href)) L.push('URL:' + location.href.split('#')[0]);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function saveFile(name, text, mime) {
  try {
    const a = document.createElement('a');
    a.href = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(text);
    a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  } catch (e) { toast('這裡無法下載檔案'); return false; }
}
function calExpiry(list) {
  const days = expDays(), today = todayStr();
  const evs = list.filter(x => x.b && x.b.exp && x.b.exp >= today).map(({ it, b }) => {
    let d = new Date(b.exp + 'T00:00'); d.setDate(d.getDate() - days);
    let ds = ymd(d); if (ds < today) ds = today;
    return { uid: it.id + '-' + b.id + '-' + b.exp, start: icsTime(ds, 9), end: icsTime(ds, 10), title: it.name + ' ' + md(b.exp) + ' 到期', desc: it.name + ' ' + b.qty + ' ' + (it.unit || '') + '，' + b.exp + ' 到期。位置：' + locText(it) };
  });
  if (!evs.length) return toast('目前沒有要加入的效期');
  if (saveFile(evs.length === 1 ? '效期提醒.ics' : '效期提醒（' + evs.length + '筆）.ics', buildIcs(evs), 'text/calendar')) toast('請在跳出的畫面選「加入」');
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-edit],[data-cell]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { tab = ds.tab; delArm = false; window.scrollTo(0, 0); return render(); }
  if (ds.go) { tab = 'inv'; filter = ds.go; return render(); }
  if (ds.filter) { filter = ds.filter; return render(); }
  if (ds.cat != null) { catF = ds.cat; return render(); }
  if (ds.jump) { e.stopPropagation(); return jump(ds.jump); }
  if (ds.edit) return editItem(ds.edit);
  if (ds.minus) return consume(ds.minus);
  if (ds.quse) { consume(ds.quse); return quickItem(ds.quse); }
  if (ds.bindto) { const it = find(ds.bindto); it.barcodes = (it.barcodes || []).concat(draft.code); commit(); toast('已綁定到「' + it.name + '」'); return quickItem(it.id); }
  if (ds.delcode != null) { draft.barcodes.splice(+ds.delcode, 1); return itemForm(); }
  if (ds.plus) return restock(ds.plus);
  if (ds.cell) { const [c, k] = ds.cell.split('|'); return openCell(c, k); }
  if (ds.editcab) return editCab(ds.editcab);
  if (ds.area) return areaForm(+ds.area);
  if (ds.newcabin) return editCab(null, S.areas[+ds.newcabin]);
  if (ds.color) { draft.color = ds.color; return cabForm(); }
  if (ds.delbatch != null) { draft.batches.splice(+ds.delbatch, 1); return itemForm(); }
  if (ds.takeout) { find(ds.takeout).loc = null; commit(); closeModal(); return toast('已移出'); }
  if (ds.newincell) { const [c, k] = ds.newincell.split('|'); return editItem(null, { cab: c, cell: k }); }
  if (ds.restock) {
    const it = find(ds.restock), q = Math.max(+$('#rq').value || 0, 0), ex = $('#re').value;
    if (!q) return toast('請輸入數量');
    const same = it.batches.find(b => (b.exp || '') === ex);
    if (same) same.qty = +same.qty + q; else it.batches.push({ id: uid(), qty: q, exp: ex });
    const amt = Math.max(+$('#rp').value || 0, 0), shop = $('#rs').value.trim();
    if (amt > 0) {
      const now = new Date();
      S.purchases.push({ id: uid(), date: todayStr(), time: pad(now.getHours()) + ':' + pad(now.getMinutes()), itemId: it.id, name: it.name, qty: q, unit: it.unit || '', amount: amt, shop });
      it.unitPrice = Math.round(amt / q * 100) / 100;
      S.settings.lastShop = shop;
    }
    const wantCal = ex && $('#rcal') && $('#rcal').checked;
    closeModal(); commit(); toast(it.name + ' 入庫 ' + q + ' ' + (it.unit || '') + (amt > 0 ? '，花費 $' + fmt(amt) : ''));
    if (wantCal) calExpiry([{ it, b: it.batches.find(b => b.exp === ex) }]);
    return;
  }
  if (ds.delp) { if (delArm !== ds.delp) { delArm = ds.delp; t.textContent = '刪?'; return; } S.purchases = S.purchases.filter(x => x.id !== ds.delp); delArm = false; return commit(); }
  const act = ds.act;
  if (!act) return;
  if (act === 'close') return closeModal();
  if (act === 'scanFind') { closeModal(); return startScan(onFound); }
  if (act === 'scanCancel') { scanCb = null; return stopScan(); }
  if (act === 'scanManual') return finishScan($('#scanmanual').value);
  if (act === 'scanBind') return startScan(code => { draft.barcodes = draft.barcodes || []; const other = S.items.find(i => i.id !== draft.id && (i.barcodes || []).includes(code)); if (other) toast('提醒：這個條碼也綁在「' + other.name + '」'); if (!draft.barcodes.includes(code)) draft.barcodes.push(code); itemForm(); }, '掃描要綁到這個用品的條碼');
  if (act === 'addCode') { const c = $('#codeIn').value.trim(); if (!c) return toast('請輸入條碼'); draft.barcodes = draft.barcodes || []; if (!draft.barcodes.includes(c)) draft.barcodes.push(c); return itemForm(); }

    const d = new Date(); d.setDate(d.getDate() + ((day - d.getDay() + 7) % 7));
    const ok = saveFile('每週採購提醒.ics', buildIcs([{ uid: 'weekly-shopping', start: icsTime(ymd(d), hr), end: icsTime(ymd(d), Math.min(hr + 1, 23)), rrule: 'FREQ=WEEKLY;BYDAY=' + ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][day], title: '看一下家裡要補什麼', desc: '打開家庭庫存 App，查看採購清單。' }]), 'text/calendar');

  if (act === 'saveCab') {

  if (act === 'import') return openModal('<h3>匯入備份</h3><p class="sample">貼上匯出的文字。會取代目前所有資料。</p><textarea class="in" id="imp"></textarea><div class="row"><button class="btn" data-act="close">取消</button><button class="btn dark" data-act="doImport">匯入</button></div>');
  if (act === 'doImport') { try { S = normalize(JSON.parse($('#imp').value)); closeModal(); commit(); toast('匯入完成'); } catch (err) { toast('格式不正確'); } return; }
  if (act === 'wipe') { if (!delArm) { delArm = true; return render(); } delArm = false; S = blank(); commit(); return toast('已清空'); }
});
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'q') { query = t.value.trim(); return render(); }
  if (t.id === 'bindq' && draft) { draft.q = t.value; const pos = t.selectionStart; bindPick(); const n = $('#bindq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} return; }
  if (!draft) return;
  if (ds.d) draft[ds.d] = t.value;
  if (ds.b != null) draft.batches[+ds.b][ds.k] = t.value;
  if (ds.c) draft[ds.c] = t.value;
  if (ds.celllbl) draft.cells[ds.celllbl] = t.value.trim();
});
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'restoreInput' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { S = normalize(JSON.parse(fr.result)); commit(); toast('還原完成'); } catch (e) { toast('這不是正確的備份檔'); } };
    fr.readAsText(t.files[0]); return;
  }
  if (t.id === 'expDays') { S.settings.expiryDays = +t.value; return commit(); }
  if (ds.size) { draft[ds.size] = Math.min(Math.max(+t.value || 1, 1), ds.size === 'rows' ? 10 : 6); return cabForm(); }
  if (ds.loccab !== undefined) { draft.loc = t.value ? { cab: t.value, cell: '0-0' } : null; return itemForm(); }
  if (ds.loccell !== undefined) { draft.loc.cell = t.value; return; }
  if (ds.bought && t.checked) { t.checked = false; const it = find(ds.bought); return restock(it.id, buyQty(it)); }
  if (ds.movein && t.value) { const [c, k] = ds.movein.split('|'); const it = find(t.value); it.loc = { cab: c, cell: k }; commit(); openCell(c, k); return toast(it.name + ' 已放入'); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#scanner').classList.contains('hidden')) { scanCb = null; stopScan(); } else closeModal(); } if (e.key === 'Enter' && e.target.id === 'scanmanual') finishScan(e.target.value); });

/* ---------- 啟動 ---------- */
function showFatal(e, raw) {
  const msg = e ? String(e.message || e) + '\n' + (e.stack || '') : String(e);
  $('#view').innerHTML = '<div class="note" style="border-color:var(--red)"><b style="color:var(--red)">畫面載入時發生錯誤</b><p>你的資料還在，沒有被刪除。請把下面這段錯誤訊息截圖給我。</p><textarea class="in" readonly>' + esc(msg) + '</textarea>' +
    (raw ? '<p>你的原始資料（可先複製保存）：</p><textarea class="in" readonly>' + esc(JSON.stringify(raw)) + '</textarea>' : '') + '</div>';
}
(async () => {
  let loaded = null;
  window.__step('讀取資料中…');
  const t0 = Date.now();
  const tick = setInterval(() => { if (!S) window.__step('讀取資料中 ' + Math.round((Date.now() - t0) / 1000) + ' 秒'); else clearInterval(tick); }, 1000);
  const slow = setTimeout(() => { if (!S) $('#view').innerHTML = '<p class="empty">還在連線讀取資料，請稍候…</p>'; }, 4000);
  try { loaded = await withTimeout(Store.load(), 25000); } catch (e) { if (Store.kind === 'gas') { clearTimeout(slow); return showFatal(e); } toast('讀取資料逾時，先用示範資料開啟'); }
  clearTimeout(slow);
  try {
    if (loaded) S = normalize(loaded);
    else if (Store.kind === 'gas' || Store.kind === 'local') S = blank();
    else { S = sample(); }
    const m = $('#mode');
    if (Store.kind === 'gas') { m.textContent = '雲端同步'; m.classList.add('on'); }
    else if (Store.kind === 'local') { m.textContent = '存在這支手機'; m.classList.add('on'); }
    else m.textContent = Store.kind === 'db' ? '示範模式・已自動儲存' : '示範模式・不會儲存';
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) $('.scanbtn').hidden = false;
    render();
  } catch (e) { Store.kind = 'readonly'; return showFatal(e, loaded); }
  if (Store.kind === 'gas') { try { settings = await gas('getSettings'); render(); } catch (e) {} }
  if (Store.kind === 'local' && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  if (Store.kind === 'local' && S.items.length > 5) { const lb = S.settings.lastBackup; if (!lb || daysLeft(lb) < -30) setTimeout(() => toast('提醒：資料只存在這支手機，記得到「設定」下載備份檔'), 1500); }
})();
}
</script>
</body>
</html>
